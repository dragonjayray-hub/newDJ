<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>古风DJ · 曲目工坊</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="app-shell">
    <header class="topbar">
      <div class="brand"><span class="brand-mark">声</span><span>古风DJ <b>曲目工坊</b></span></div>
      <div class="status"><span class="live-dot"></span><span id="statusText">等待导入曲目</span></div>
      <button class="export-button" id="exportButton">导出工程</button>
    </header>

    <section class="workspace">
      <aside class="sidebar">
        <section class="panel library-panel">
          <div class="panel-heading"><span>音频栏</span><button class="icon-button" id="addTrack" aria-label="添加音频">＋</button></div>
          <label class="music-drop" id="musicDrop" for="musicInput">
            <input id="musicInput" type="file" accept="audio/*" hidden />
            <span class="upload-icon">↥</span>
            <strong>拖入一首正常歌曲</strong>
            <small>自动识别速度、调性与和声</small>
          </label>
          <div class="track-card" id="trackCard" hidden>
            <div class="cover-art">古</div><div class="track-info"><b id="trackName">未命名曲目</b><small id="trackMeta">—</small></div><button class="play-button" id="playButton">▶</button>
          </div>
        </section>
        <section class="panel process-panel">
          <div class="panel-heading"><span>古风处理链</span><span class="chain-active">ACTIVE</span></div>
          <div class="control"><label>降速 <output id="speedOut">−12%</output></label><input id="speedRange" type="range" min="-35" max="0" value="-12" /></div>
          <div class="control"><label>降调 <output id="pitchOut">−3 st</output></label><input id="pitchRange" type="range" min="-12" max="0" value="-3" /></div>
          <div class="filter-card"><div><b>低切处理器</b><small>High-pass · 24 dB/oct</small></div><label class="switch"><input id="filterToggle" type="checkbox" checked /><span></span></label></div>
          <div class="control filter-control"><label>截止频率 <output id="cutOut">88 Hz</output></label><input id="cutRange" type="range" min="25" max="300" value="88" /></div>
        </section>
      </aside>

      <section class="editor">
        <div class="editor-head"><div><p class="eyebrow">AI HARMONIC MAP</p><h1 id="editorTitle">把流行歌变成古风的第一步</h1></div><div class="pill" id="analysisState">等待分析</div></div>
        <section class="analysis-card">
          <div class="transport"><button class="transport-play" id="transportButton">▶</button><div><b id="timeReadout">00:00.0</b><small id="durationReadout">/ 00:00.0</small></div><input id="seekRange" type="range" min="0" max="100" value="0" /><span id="bpmReadout">— BPM</span><span class="key-readout" id="keyReadout">—</span></div>
          <div class="timeline-wrap"><div class="timeline-labels"><span>小节与和声</span><span>悬停小节查看和弦</span></div><div id="timeline" class="timeline" aria-label="和声小节线"></div><div class="playhead" id="playhead"></div></div>
          <p class="analysis-note" id="analysisNote">导入音频后，AI 会将和弦结果按小节嵌入时间线。</p>
        </section>
        <section class="instrument-section">
          <div class="section-title"><div><p class="eyebrow">ANCIENT RHYTHM</p><h2>古风DJ 乐器</h2></div><span>随曲目节拍与调性自适应</span></div>
          <article class="drum-card"><div class="drum-top"><div class="drum-name"><span class="drum-index">01</span><div><b>Kick 条</b><small id="kickLabel">把 one-shot 拖到这里</small></div></div><label class="sample-button" id="kickDrop" for="kickInput"><input id="kickInput" type="file" accept="audio/*" hidden />载入 Kick</label></div><div class="beat-grid" id="beatGrid"></div><div class="drum-footer"><span><i></i> 自动落点：每小节第 1、3 拍</span><button id="clearKick">清除采样</button></div></article>
        </section>
      </section>
    </section>
  </main>
  <div id="toast" class="toast"></div>
  <script src="app.js"></script>
</body>
</html>
